version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: carbonsynq_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: carbonsynq
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: carbonsynq_backend
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/carbonsynq?schema=public
      - JWT_SECRET=supersecretkey_change_me_in_prod
      - PORT=5000
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
